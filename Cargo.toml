[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/TheDancingDeveloper-org/graft"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "allow"

# One dependency per line, sorted, so parallel PRs don't conflict
# (docs/plan.md, "Crate ownership and parallelism"). External dependencies are
# added by the work item that first needs them.
[workspace.dependencies]
blake3 = "1.8"
flate2 = "1.1"
graft-auth = { path = "crates/graft-auth" }
graft-client = { path = "crates/graft-client" }
graft-engine = { path = "crates/graft-engine" }
graft-gc = { path = "crates/graft-gc" }
graft-git = { path = "crates/graft-git" }
graft-index = { path = "crates/graft-index" }
graft-lsp = { path = "crates/graft-lsp" }
graft-mcp = { path = "crates/graft-mcp" }
graft-model = { path = "crates/graft-model" }
graft-proto = { path = "crates/graft-proto" }
graft-store = { path = "crates/graft-store" }
graft-store-fs = { path = "crates/graft-store-fs" }
graft-store-sqlite = { path = "crates/graft-store-sqlite" }
graft-telemetry = { path = "crates/graft-telemetry" }
graft-testkit = { path = "crates/graft-testkit" }
proptest = "1.7"
prost = "0.14"
protox = "0.9"
rmcp = { version = "3.6.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
