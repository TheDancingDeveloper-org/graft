[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/TheDancingDeveloper-org/graft"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "allow"

# One dependency per line, sorted, so parallel PRs don't conflict
# (docs/plan.md, "Crate ownership and parallelism"). External dependencies are
# added by the work item that first needs them.
[workspace.dependencies]
assert_cmd = "2.2"
axum = "0.8"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "2.2"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
gix = { version = "0.89", default-features = false, features = ["parallel", "sha1"] }
graft-auth = { path = "crates/graft-auth" }
graft-client = { path = "crates/graft-client" }
graft-engine = { path = "crates/graft-engine" }
graft-gc = { path = "crates/graft-gc" }
graft-git = { path = "crates/graft-git" }
graft-index = { path = "crates/graft-index" }
graft-lsp = { path = "crates/graft-lsp" }
graft-mcp = { path = "crates/graft-mcp" }
graft-model = { path = "crates/graft-model" }
graft-proto = { path = "crates/graft-proto" }
graft-store = { path = "crates/graft-store" }
graft-store-fs = { path = "crates/graft-store-fs" }
graft-store-sqlite = { path = "crates/graft-store-sqlite" }
graft-telemetry = { path = "crates/graft-telemetry" }
graft-testkit = { path = "crates/graft-testkit" }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
imara-diff = "0.2"
insta = { version = "1.49", features = ["json"] }
jsonschema = { version = "0.58", default-features = false }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
predicates = "3.1"
prometheus = { version = "0.14", default-features = false }
proptest = "1.7"
prost = "0.14"
protox = "0.9"
rmcp = { version = "3.6.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
rustix = { version = "1.1", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.9"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1"
