# Local dev stack for graft. Read docs/dev-stack.md first.
#
# Services without a profile are the default stack: graft-server and graft-node
# from the image. Profiles:
#   dev         graft-server-dev, graft-node-dev, graft-mirror-dev: host binaries
#               from target/debug (fast loop; no image rebuild). scripts/dev/up.sh
#               --dev scales the default server and node to 0 while they run.
#   mirror      graft-mirror following a local fixture git repo
#   rusttorrent graft-mirror-rusttorrent cloning the rustTorrent repository
#   obs         prometheus and grafana scraping /metrics
#   tools       client, the graft CLI toolbox: docker compose run --rm client graft ...
#
# Bind sources use ${GRAFT_HOST_ROOT}, the checkout's path on the Docker daemon's
# host. scripts/dev/lib.sh sets it; it defaults to "." for a local daemon.
#
# Every published port is bound to 127.0.0.1. Host ports default to values that
# are free on the dev host (7878, 3000 and 9090 are taken by other services
# there); override with GRAFT_DEV_SERVER_PORT, GRAFT_DEV_PROMETHEUS_PORT and
# GRAFT_DEV_GRAFANA_PORT. Images and named volumes are prefixed graft-dev.
# Nothing here holds a secret.
name: graft-dev

x-build: &build
  image: graft-dev:local
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}

# A stub binary exits once with its "not implemented yet" line. Retry a few
# times, then stop, so the stack never crash-loops silently.
x-retry: &retry
  restart: "on-failure:3"

services:
  # ---- default stack (no profile) -----------------------------------------

  graft-server:
    <<: [*build, *retry]
    command: ["graft-server", "serve", "--config", "/etc/graft/server.toml"]
    ports:
      - "127.0.0.1:${GRAFT_DEV_SERVER_PORT:-17878}:7878"
    volumes:
      - ${GRAFT_HOST_ROOT:-.}/docker/dev/server.toml:/etc/graft/server.toml:ro
      - graft-dev-server-objects:/var/lib/graft/objects
      - graft-dev-server-meta:/var/lib/graft/meta
    # healthcheck: add once the server serves /healthz (docs/dev-stack.md).
    # Fallback loop that works with a remote daemon: `docker compose watch graft-server`
    # copies target/debug/graft-server into the container over the API, then restarts it.
    develop:
      watch:
        - action: sync+restart
          path: ./target/debug/graft-server
          target: /usr/local/bin/graft-server

  graft-node:
    <<: [*build, *retry]
    command: ["graft-node"]
    volumes:
      - graft-dev-run:/run/graft
      - graft-dev-node-cache:/var/cache/graft
    develop:
      watch:
        - action: sync+restart
          path: ./target/debug/graft-node
          target: /usr/local/bin/graft-node

  # ---- dev profile: host binaries from target/debug (bind over the image copy)

  graft-server-dev:
    <<: [*build, *retry]
    profiles: [dev]
    command: ["graft-server", "serve", "--config", "/etc/graft/server.toml"]
    ports:
      - "127.0.0.1:${GRAFT_DEV_SERVER_PORT:-17878}:7878"
    volumes:
      - ${GRAFT_HOST_ROOT:-.}/docker/dev/server.toml:/etc/graft/server.toml:ro
      - ${GRAFT_HOST_ROOT:-.}/target/debug/graft-server:/usr/local/bin/graft-server:ro
      - graft-dev-server-objects:/var/lib/graft/objects
      - graft-dev-server-meta:/var/lib/graft/meta
    networks:
      default:
        aliases: [graft-server]

  graft-node-dev:
    <<: [*build, *retry]
    profiles: [dev]
    command: ["graft-node"]
    volumes:
      - graft-dev-run:/run/graft
      - graft-dev-node-cache:/var/cache/graft
      - ${GRAFT_HOST_ROOT:-.}/target/debug/graft-node:/usr/local/bin/graft-node:ro
    networks:
      default:
        aliases: [graft-node]

  graft-mirror-dev:
    <<: [*build, *retry]
    profiles: [dev]
    entrypoint: ["sh", "/etc/graft-dev/mirror/fixture-entrypoint.sh"]
    command: ["graft-mirror", "follow", "--config", "/etc/graft-dev/mirror/fixture.toml"]
    volumes:
      - ${GRAFT_HOST_ROOT:-.}/docker/dev:/etc/graft-dev:ro
      - ${GRAFT_HOST_ROOT:-.}/target/debug/graft-mirror:/usr/local/bin/graft-mirror:ro
      - graft-dev-mirror-fixture:/var/lib/graft/mirror
    networks:
      default:
        aliases: [graft-mirror]

  # ---- mirror profiles -----------------------------------------------------

  graft-mirror:
    <<: [*build, *retry]
    profiles: [mirror]
    entrypoint: ["sh", "/etc/graft-dev/mirror/fixture-entrypoint.sh"]
    command: ["graft-mirror", "follow", "--config", "/etc/graft-dev/mirror/fixture.toml"]
    volumes:
      - ${GRAFT_HOST_ROOT:-.}/docker/dev:/etc/graft-dev:ro
      - graft-dev-mirror-fixture:/var/lib/graft/mirror

  graft-mirror-rusttorrent:
    <<: [*build, *retry]
    profiles: [rusttorrent]
    command: ["graft-mirror", "follow", "--config", "/etc/graft-dev/mirror/rusttorrent.toml"]
    volumes:
      - ${GRAFT_HOST_ROOT:-.}/docker/dev:/etc/graft-dev:ro
      - graft-dev-mirror-rusttorrent:/var/lib/graft/mirror

  # ---- tools profile -------------------------------------------------------

  client:
    <<: *build
    profiles: [tools]
    command: ["graft", "version"]
    working_dir: /work
    volumes:
      - graft-dev-run:/run/graft
      - graft-dev-client-work:/work

  # ---- obs profile ---------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:${GRAFT_DEV_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ${GRAFT_HOST_ROOT:-.}/docker/dev/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - graft-dev-prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [obs]
    environment:
      # Local, loopback-only dev dashboards: no login, editor role.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    ports:
      - "127.0.0.1:${GRAFT_DEV_GRAFANA_PORT:-13100}:3000"
    volumes:
      - ${GRAFT_HOST_ROOT:-.}/docker/dev/grafana/provisioning:/etc/grafana/provisioning:ro
      - graft-dev-grafana:/var/lib/grafana
    restart: unless-stopped

volumes:
  graft-dev-server-objects:
  graft-dev-server-meta:
  graft-dev-run:
  graft-dev-node-cache:
  graft-dev-mirror-fixture:
  graft-dev-mirror-rusttorrent:
  graft-dev-client-work:
  graft-dev-prometheus:
  graft-dev-grafana:
