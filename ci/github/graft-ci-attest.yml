# Manual, non-required rehearsal for the graft development deployment.
# Called from a protected ref. The token-holding steps live only in this
# reusable workflow, which the server binding pins at refs/heads/main.
# A caller on a batch branch must pin this file to main so the OIDC
# job_workflow_ref is the protected copy, not the branch's own files.
name: graft CI attestation rehearsal

on:
  workflow_call:
    inputs:
      changeset:
        description: Landed graft changeset ID exported at this commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    name: Attest landed changeset
    runs-on: [graft-dev]
    permissions:
      contents: read
      id-token: write
    env:
      # The server address the runner can reach; set the repository
      # variable GRAFT_ENDPOINT when the server is not on loopback.
      GRAFT_ENDPOINT: ${{ vars.GRAFT_ENDPOINT || 'http://127.0.0.1:17888' }}
      GRAFT_REPO: graft
      # attest and ci are experimental client commands in this release.
      GRAFT_EXPERIMENTAL: "1"
      OIDC_AUDIENCE: graft-dev
      CHANGESET: ${{ inputs.changeset }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Install the graft client from the deployed server image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          docker cp graft-dev-server:/usr/local/bin/graft "$RUNNER_TEMP/bin/graft"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Exchange identity and attest
        shell: bash
        run: |
          set -euo pipefail

          audience=$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')
          oidc_token=$(printf 'Authorization: Bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | \
            curl -fsS --max-time 30 -H @- \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -er '.value')
          echo "::add-mask::$oidc_token"

          umask 077
          token_file=$(mktemp "$RUNNER_TEMP/graft-token.XXXXXX")
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$oidc_token" | graft --endpoint "$GRAFT_ENDPOINT" \
            ci exchange --provider github --changeset "$CHANGESET" --out "$token_file"
          unset oidc_token

          graft --endpoint "$GRAFT_ENDPOINT" --repo "$GRAFT_REPO" \
            --token-file "$token_file" attest "$CHANGESET" \
            --check "ci/github-oidc-rehearsal" --pass --url "$RUN_URL"
