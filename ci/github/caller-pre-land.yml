# Caller: copy to .github/workflows/graft-pre-land.yml in a graft-managed
# repository. Runs the required checks on the branches the mirror pushes for
# drafts, and attests them to graft.
name: graft pre-land

on:
  push:
    branches: ['graft/**']

permissions:
  contents: read
  id-token: write

jobs:
  pre-land:
    # Pin the shared workflow to a ref the graft binding also names
    # (`job_workflow_ref`); a different ref gets no token.
    uses: SHARED-ORG/graft-ci/.github/workflows/graft-pre-land.yml@refs/heads/main
    with:
      graft-endpoint: https://graft.example.com
      graft-repo: myrepo
      audience: https://graft.example.com
      checks: >-
        [
          {"name": "ci/build", "run": "cargo build --workspace --locked"},
          {"name": "ci/test", "run": "cargo nextest run --workspace --locked"}
        ]
