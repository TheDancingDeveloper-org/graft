name: image

# The graft container image (docker/Dockerfile): graft, graft-server,
# graft-node and graft-mirror on Debian slim, uid 10001. The pilot stack on
# Node B (ops repo personal/graft, plan G1.17) pins it by tag and digest.
#
# - workflow_dispatch on main: build and push ghcr.io/<owner>/graft:sha-<sha>.
#   This is how the operator cuts a pilot image from a landed commit.
# - tags v*: the same, also tagged with the version.
# - pull requests that touch the Dockerfile or this workflow: build only, no
#   push, so the publish path is tested before anyone relies on it.
# Never a required check, and no push trigger on main: the merge queue has
# already tested what lands.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - docker/Dockerfile
      - .dockerignore
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    # Self-hosted only (see the runner-policy job in ci.yml); `docker`
    # selects a runner with a Docker daemon for buildx.
    runs-on: [self-hosted, docker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Layer cache (WI-2234): a named builder whose BuildKit state is kept
      # in the runner's own Docker daemon between jobs, so its layer cache and
      # the Dockerfile's cargo cache mounts stay warm on that runner. This
      # replaces cache-from/to type=gha, which started empty and was slow to
      # reach from a self-hosted runner. A builder left by a job that died
      # before its cleanup is removed first, keeping its state.
      - name: Remove a stale builder
        run: docker buildx rm --keep-state graft-image 2>/dev/null || true
      - uses: docker/setup-buildx-action@v3
        with:
          name: graft-image
          keep-state: true

      # The runners compile through the shared sccache bucket (ops repo
      # personal/github-runner). Hand its settings to the build; the keys go
      # in as build secrets (secret-envs below), never as build args. On a
      # runner without them, the Dockerfile builds without sccache.
      - name: sccache settings
        id: sccache
        run: |
          {
            echo "args<<EOF"
            echo "SCCACHE_BUCKET=${SCCACHE_BUCKET:-}"
            echo "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT:-}"
            echo "SCCACHE_REGION=${SCCACHE_REGION:-}"
            echo "SCCACHE_S3_USE_SSL=${SCCACHE_S3_USE_SSL:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Registry names must be lowercase; the org name is not.
      - name: Image references
        id: ref
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/graft"
          tags="$image:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$tags,$image:$GITHUB_REF_NAME"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push outside pull requests)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.ref.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ steps.sccache.outputs.args }}
          secret-envs: |
            sccache_key_id=AWS_ACCESS_KEY_ID
            sccache_secret=AWS_SECRET_ACCESS_KEY

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### graft image"
            echo
            echo "Pin this in the ops repo (personal/graft/docker-compose.yml):"
            echo
            echo '```'
            echo "${{ steps.ref.outputs.image }}:sha-${GITHUB_SHA}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
