name: image

# The graft container image (docker/Dockerfile): graft, graft-server,
# graft-node and graft-mirror on Debian slim, uid 10001. The pilot stack on
# Node B (ops repo personal/graft, plan G1.17) pins it by tag and digest.
#
# - workflow_dispatch on main: build and push ghcr.io/<owner>/graft:sha-<sha>.
#   This is how the operator cuts a pilot image from a landed commit.
# - tags v*: the same, also tagged with the version.
# - pull requests that touch the Dockerfile or this workflow: build only, no
#   push, so the publish path is tested before anyone relies on it.
# Never a required check, and no push trigger on main: the merge queue has
# already tested what lands.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - docker/Dockerfile
      - .dockerignore
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Registry names must be lowercase; the org name is not.
      - name: Image references
        id: ref
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/graft"
          tags="$image:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$tags,$image:$GITHUB_REF_NAME"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push outside pull requests)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.ref.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### graft image"
            echo
            echo "Pin this in the ops repo (personal/graft/docker-compose.yml):"
            echo
            echo '```'
            echo "${{ steps.ref.outputs.image }}:sha-${GITHUB_SHA}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
