name: deploy-dev

# Deploy the graft-dev stack (deploy/) on the graft-dev VM, from the runner
# that lives on that VM (labels self-hosted, graft-dev). It runs deploy/up.sh,
# which pulls the image pinned in deploy/image.env and brings the stack up.
#
# - push to main touching deploy/**: a repin of deploy/image.env or a config
#   change deploys itself once it lands.
# - workflow_dispatch: redeploy by hand (for example after a VM rebuild).
# Not a required check. Secrets stay on the VM under /etc/graft; this
# workflow passes none to the script.
on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/deploy-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One deploy at a time, in order; never cancel one half-way.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, graft-dev]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The job's own short-lived token, on stdin; logged out again below.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        run: deploy/up.sh

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
