[package]
name = "graft-node"
description = "Per-host graft cache daemon serving every session on the host over a Unix socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "graft-node"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum.workspace = true
graft-auth.workspace = true
graft-model.workspace = true
graft-proto.workspace = true
graft-store.workspace = true
graft-store-fs.workspace = true
graft-telemetry.workspace = true
prometheus.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["gzip"] }
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
graft-client.workspace = true
hyper-util.workspace = true
tempfile.workspace = true
tonic-prost.workspace = true
