[package]
name = "graft-attester"
description = "graft trial attester: builds and tests new drafts and posts Attest per check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace = true
graft-client.workspace = true
graft-model.workspace = true
graft-proto.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
axum.workspace = true
graft-engine.workspace = true
graft-store = { workspace = true, features = ["testkit"] }
graft-testkit.workspace = true
tempfile.workspace = true
