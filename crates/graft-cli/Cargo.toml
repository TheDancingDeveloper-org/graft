[package]
name = "graft-cli"
description = "The graft command-line client, including graft mcp and graft lsp."
version.workspace = true
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "graft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64.workspace = true
clap.workspace = true
graft-client.workspace = true
graft-mirror = { path = "../graft-mirror" }
graft-node = { path = "../graft-node" }
graft-server = { path = "../graft-server" }
graft-store-fs.workspace = true
graft-lsp.workspace = true
graft-mcp.workspace = true
graft-model.workspace = true
graft-proto.workspace = true
graft-telemetry.workspace = true
imara-diff.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tonic.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
graft-engine.workspace = true
graft-store = { workspace = true, features = ["testkit"] }
graft-testkit.workspace = true
insta.workspace = true
jsonschema.workspace = true
predicates.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
