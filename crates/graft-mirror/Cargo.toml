[package]
name = "graft-mirror"
description = "git and GitHub mirror for graft: import, follow, export, batch PRs, PR import, authority switch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "graft-mirror"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
graft-client.workspace = true
graft-git.workspace = true
graft-model.workspace = true
graft-proto.workspace = true
graft-telemetry.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
toml.workspace = true
tonic = { workspace = true, features = ["gzip"] }
tracing.workspace = true
jsonwebtoken = "9"
tempfile.workspace = true

[dev-dependencies]
graft-engine.workspace = true
graft-store = { workspace = true, features = ["testkit"] }
graft-store-fs.workspace = true
graft-store-sqlite.workspace = true
graft-testkit.workspace = true
prometheus.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
