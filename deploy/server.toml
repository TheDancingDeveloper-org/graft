# graft-server for the graft-dev VM (deploy/, WI-2251). Ported from the Node B
# stack (ops repo personal/graft-dev). Keys: crates/graft-server/src/config.rs;
# unknown keys are refused at start-up.
# 0.0.0.0 is the container's namespace: compose publishes the ports on
# GRAFT_BIND_IP only.
listen = "0.0.0.0:7878"
metrics = "0.0.0.0:9464"
objects_dir = "/var/lib/graft/objects"
meta_db = "/var/lib/graft/meta/meta.db"
# Host file /etc/graft/signing.key, mounted read-only (mode 0600, owned by
# uid 10001). up.sh creates it on first run; it is never in git.
key_file = "/run/secrets/signing.key"
# Writes are refused below 5% free on either volume.
min_free_fraction = 0.05
json_logs = true
# 30 days, so development service tokens last a month.
max_token_ttl_s = 2592000
shutdown_grace_s = 20

# Per-line land policy (WI-2288). Absent, `main` is decision D6 (attested on
# ci/build and ci/test) and every other line lands directly. A [[lines]] entry
# replaces the default for its name; unnamed lines keep theirs, and an
# optional [default_line] table replaces the direct default. Global to the
# server for now (not per repository). Keys: crates/graft-server/src/lines.rs.
#
# Decision D22 (docs/decisions.md): phase 1 is a git alternative. Every line
# lands `direct`: rebase, line merge and CAS, with no build, test or CI in the
# land path. `attested`, `queued`, post-land CI and auto-revert are phase 2
# and stay off here. The engine still defaults `main` to D6, so `main` is
# listed to make it direct. It is git-primary, so the mirror's main stays
# what GitHub says.
[[lines]]
name = "main"
policy = "direct"
authority = "git-primary"

# The WI-2270 trial line (decision D21): agents land here, directly (D22).
# The operator merges the batch PR that `graft-mirror pr-batch trial-1`
# opens, and GitHub CI runs on that PR. Create the line with
# trial/create-trial-line.sh.
[[lines]]
name = "trial-1"
policy = "direct"
authority = "graft-primary"
