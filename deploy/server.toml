# graft-server for the graft-dev VM (deploy/, WI-2251). Ported from the Node B
# stack (ops repo personal/graft-dev). Keys: crates/graft-server/src/config.rs;
# unknown keys are refused at start-up.
# 0.0.0.0 is the container's namespace: compose publishes the ports on
# GRAFT_BIND_IP only.
listen = "0.0.0.0:7878"
metrics = "0.0.0.0:9464"
objects_dir = "/var/lib/graft/objects"
meta_db = "/var/lib/graft/meta/meta.db"
# Host file /etc/graft/signing.key, mounted read-only (mode 0600, owned by
# uid 10001). up.sh creates it on first run; it is never in git.
key_file = "/run/secrets/signing.key"
# Writes are refused below 5% free on either volume.
min_free_fraction = 0.05
json_logs = true
# 30 days, so development service tokens last a month.
max_token_ttl_s = 2592000
shutdown_grace_s = 20

# Per-line land policy (WI-2288, WI-2298). Decision D22: phase 1 is a git
# alternative, so every line, `main` included, lands `direct` by default, with
# no build, test or CI in the land path. A [[lines]] entry replaces the
# default for its name and opts it into `attested`, `queued` or `post_land`
# checks (the phase-2 setting); unnamed lines stay direct, and an optional
# [default_line] table replaces the direct default. Global to the server for
# now (not per repository). Keys: crates/graft-server/src/lines.rs.
#
# `main` is direct (D22) and git-primary, so the mirror's main stays what
# GitHub says. Listed so the authority is explicit.
[[lines]]
name = "main"
policy = "direct"
authority = "git-primary"

# Phase 2 (D22): decision D6 for `main` is opt-in, no longer the engine
# default. To gate `main` on CI attestations, with the same checks post-land
# and an automatic revert on failure, replace the entry above with:
#
# [[lines]]
# name = "main"
# policy = "attested"
# checks = ["ci/build", "ci/test"]
# attest_merged = false
# authority = "git-primary"
# post_land = { checks = ["ci/build", "ci/test"], auto_revert = true }

# The WI-2270 trial line (decision D21): agents land here directly (D22). The
# operator merges the batch PR that `graft-mirror pr-batch trial-1` opens.
# Create the line with trial/create-trial-line.sh. Phase 2 gates it on the
# attester's checks again: policy = "attested",
# checks = ["ci/fmt", "ci/clippy", "ci/test"], attest_merged = false.
[[lines]]
name = "trial-1"
policy = "direct"
authority = "graft-primary"
