# Generated by deploy/onboard-repo.sh. Nothing here is secret.
server = "http://graft-server:7878"
repo = "graft"
upstream = "https://github.com/TheDancingDeveloper-org/graft.git"
mirror_dir = "/var/lib/graft/mirror/graft.git"
db = "/var/lib/graft/mirror/graft.sqlite"
token_file = "/run/secrets/graft-mirror-token"
poll_interval_secs = 15
metrics_addr = "0.0.0.0:9465"
json_logs = true


[github]
owner = "TheDancingDeveloper-org"
repo = "graft"
token_file = "/run/secrets/github-token"
[export]
# Batch commits with no [export.authors] mapping for the land principal (WI-2511).
default_author = "thedancingdeveloper <306930456+thedancingdeveloper@users.noreply.github.com>"

[[lines]]
branch = "main"
line = "main"

# Per-land check refs for the post-land line `exit-rehearsal`: every land is
# exported, recorded and pushed as refs/heads/graft/check/exit-rehearsal/<changeset>
# for the post-land checker to dispatch on (docs/runbooks/v02-exit.md).
# The line's server config must be checks = "post-land".
[[check_refs]]
line = "exit-rehearsal"
prefix = "graft/check/exit-rehearsal/"
