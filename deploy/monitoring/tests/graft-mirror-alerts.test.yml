# promtool test rules deploy/monitoring/tests/graft-mirror-alerts.test.yml
# (run from deploy/monitoring; the rule file is resolved relative to this one).
rule_files:
  - ../graft-mirror-alerts.yml

evaluation_interval: 1m

tests:
  # A divergence names the repository and the line, and ends with the
  # series: a removed mirror's task stops and its series are dropped.
  - interval: 1m
    input_series:
      - series: 'graft_mirror_divergence{job="graft-mirror", repo="rustnzb", line="main"}'
        values: '0 1x9 _x10'
      - series: 'graft_mirror_divergence{job="graft-mirror", repo="vogt", line="main"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: GraftMirrorDiverged
        exp_alerts:
          - exp_labels:
              severity: critical
              repo: rustnzb
              line: main
            exp_annotations:
              summary: "graft-mirror: rustnzb line main has diverged from upstream and is stopped"
      - eval_time: 18m
        alertname: GraftMirrorDiverged
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'graft_mirror_poll_error{job="graft-mirror", repo="vogt", code="auth_failed"}'
        values: '1x30'
      - series: 'graft_mirror_poll_error{job="graft-mirror", repo="vogt", code="force_pushed"}'
        values: '_x5 1x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: GraftMirrorCredentialError
        exp_alerts:
          - exp_labels:
              severity: warning
              job: graft-mirror
              repo: vogt
              code: auth_failed
            exp_annotations:
              summary: "graft-mirror: the credential for vogt has been refused for 15m"
      - eval_time: 20m
        alertname: GraftMirrorForcePushed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: graft-mirror
              repo: vogt
              code: force_pushed
            exp_annotations:
              summary: "graft-mirror: vogt upstream was force-pushed; the line is stopped"

  - interval: 1m
    input_series:
      - series: 'graft_mirror_lease_lost_total{job="graft-mirror"}'
        values: '0x5 1x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: GraftMirrorLeaseLost
        exp_alerts: []
      - eval_time: 7m
        alertname: GraftMirrorLeaseLost
        exp_alerts:
          - exp_labels:
              severity: warning
              job: graft-mirror
            exp_annotations:
              summary: "graft-mirror: 1 repository lease(s) lost in 15m; check for a second mirror process on the same data"
